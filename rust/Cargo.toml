[workspace]
resolver = "2"
members = [
    "apps/subspace_game",
    "apps/subspace_shipyard",
    "apps/subspace_server",
    "apps/subspace_tools",
    "crates/subspace_core",
    "crates/subspace_assets",
    "crates/subspace_project",
    "crates/subspace_ship",
    "crates/subspace_shipyard",
    "crates/subspace_ship_pcg",
    "crates/subspace_ship_interior",
    "crates/subspace_ship_systems",
    "crates/subspace_activity",
    "crates/subspace_migration",
    "crates/subspace_test_fixtures",
    "editor/subspace_ember_bridge",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
